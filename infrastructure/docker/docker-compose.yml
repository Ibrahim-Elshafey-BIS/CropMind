# infrastructure/docker/docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cropmind_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cropmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cropmind123}
      POSTGRES_DB: ${POSTGRES_DB:-cropmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/schemas/db_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../data/seeds/farms_seed.sql:/docker-entrypoint-initdb.d/02_farms_seed.sql
      - ../data/seeds/crops_seed.sql:/docker-entrypoint-initdb.d/03_crops_seed.sql
      - ../data/seeds/transactions_seed.sql:/docker-entrypoint-initdb.d/04_transactions_seed.sql
    networks:
      - cropmind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cropmind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: cropmind_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cropmind}:${POSTGRES_PASSWORD:-cropmind123}@db:5432/${POSTGRES_DB:-cropmind}
      GROQ_API_KEY: ${GROQ_API_KEY}
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cropmind-network
    volumes:
      - ../backend:/app
      - ../ml_models:/app/ml_models
      - ../ai_engine:/app/ai_engine
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ai_engine:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: cropmind_ai
    ports:
      - "8001:8001"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - backend
    networks:
      - cropmind-network
    volumes:
      - ../ai_engine:/app
      - ../ml_models:/app/ml_models

  cv_service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.cv
    container_name: cropmind_cv
    ports:
      - "8002:8002"
    environment:
      CV_MODEL_PATH: /app/models/model_unquant.tflite
      CV_LABELS_PATH: /app/models/labels.txt
    networks:
      - cropmind-network
    volumes:
      - ../computer_vision:/app

  n8n:
    image: n8nio/n8n:latest
    container_name: cropmind_n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
    depends_on:
      - backend
    networks:
      - cropmind-network
    volumes:
      - n8n_data:/home/node/.n8n
      - ../automation/workflows:/home/node/.n8n/workflows

  nginx:
    image: nginx:alpine
    container_name: cropmind_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai_engine
      - cv_service
      - n8n
    networks:
      - cropmind-network

networks:
  cropmind-network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
